<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Stylizacja kart */
    .card {
      transition: all 0.4s ease;
      cursor: pointer;
      transform-origin: center bottom;
    }

    /* Efekt wachlarza */
    .card-1 { transform: translate(200px, 50px) rotate(-10deg); }
    .card-2 { transform: translate(250px, 40px) rotate(0deg); z-index: 10; }
    .card-3 { transform: translate(300px, 50px) rotate(10deg); }

    /* HOVER - To co chciałeś: interakcja */
    /* Gdy najedziesz na konkretną kartę */
    .card:hover {
      transform: translate(250px, 20px) scale(1.2) rotate(0deg);
      z-index: 100; /* W SVG to działa przez kolejność w kodzie, ale tutaj symulujemy */
    }
    
    /* Tekst */
    text { font-family: 'Courier New', monospace; font-weight: bold; fill: white; }
  </style>

  <rect width="100%" height="100%" fill="#111" rx="10" />

  <g class="card card-1">
    <rect x="0" y="0" width="100" height="140" fill="#333" stroke="white" stroke-width="2" rx="5"/>
    <text x="50" y="70" text-anchor="middle" font-size="12">EVIDENCE A</text>
  </g>

  <g class="card card-3">
    <rect x="0" y="0" width="100" height="140" fill="#333" stroke="white" stroke-width="2" rx="5"/>
    <text x="50" y="70" text-anchor="middle" font-size="12">EVIDENCE C</text>
  </g>

  <g class="card card-2">
    <rect x="0" y="0" width="100" height="140" fill="#444" stroke="red" stroke-width="2" rx="5"/>
    <text x="50" y="70" text-anchor="middle" font-size="12">TOP SECRET</text>
  </g>
  
  <text x="300" y="250" text-anchor="middle" fill="#666" font-size="14">HOVER TO INSPECT</text>
</svg>
